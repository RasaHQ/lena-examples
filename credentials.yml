# This file contains the credentials for the voice & chat platforms
# which your bot is using.
# https://rasa.com/docs/rasa-pro/connectors/messaging-and-voice-channels/

rest:
#  # you don't need to provide anything here - this channel doesn't
#  # require any credentials

# Used by `rasa inspect` (loads the `inspector` connector).
# Auth for Google ASR/TTS uses Application Default Credentials
# (`gcloud auth application-default login` or GOOGLE_APPLICATION_CREDENTIALS).
# ASR project comes from GOOGLE_CLOUD_PROJECT (required), e.g.:
#   export GOOGLE_CLOUD_PROJECT=<your-gcp-project-id>
inspector:
  server_url: "http://localhost:5005"
  # Match Chirp-friendly rates (default inspector is 48kHz). Lower rate =
  # less audio to ship for ASR and less TTS resampling work.
  sample_rate: 24000
  asr:
    name: custom-component.google_voice.google_asr.GoogleASR
    # Prefer the multi-region closest to you (eu if you're in Europe).
    location: us
    # Finalize quicker after the user stops speaking (short utterances /
    # handles / yes-no). Use "supershort" only for single-word answers —
    # it can cut people off mid-sentence. Requires google-cloud-speech>=2.33.
    endpointing_sensitivity: short
    interim_results: true
    enable_voice_activity_events: true
    # One entry per language in config.yml (`language` + `additional_languages`).
    # `language` is the Chirp language code; `model` the recognizer model.
    # Rasa switches entries automatically when the language slot changes.
    language_map:
      en-US:
        language: en-US
        model: chirp_3
      es-US:
        language: es-US
        model: chirp_3
  tts:
    name: custom-component.google_voice.google_tts.GoogleTTS
    # Match the ASR region for data residency (optional; global if unset).
    location: us
    # One entry per config.yml language: `language` is the voice locale,
    # `voice` a Chirp 3: HD voice for that locale.
    language_map:
      en-US:
        language: en-US
        voice: en-US-Chirp3-HD-Charon
      es-US:
        language: es-US
        voice: es-US-Chirp3-HD-Charon
  interruptions:
    enabled: true
    min_words: 3
