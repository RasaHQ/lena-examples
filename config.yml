recipe: default.v1
language: en
assistant_id: nullary-voltage
pipeline:
  # Python 3.12+ builds here omit TensorFlow; use LogisticRegressionClassifier instead
  # of DIETClassifier (train with rasa315nlu or similar).
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: CountVectorsFeaturizer
  - name: LogisticRegressionClassifier
  - name: custom.fallback_nlu_command_adapter.FallbackNLUCommandAdapter
    fallback_flow_id: fallback
policies:
  - name: FlowPolicy
