action_endpoint:
  actions_module: "actions"

model_groups:
  - id: openai-gpt-4o
    models:
      - provider: openai
        model: gpt-4o-2024-11-20
        request_timeout: 7
        max_tokens: 256
  - id: openai-gpt-4o-mini
    models:
      - provider: openai
        model: gpt-4o-mini
        request_timeout: 7
        temperature: 1.0

nlg:
  type: rephrase
  rephrase_all: True
  summarize_history: False
  llm:
    model_group: openai-gpt-4o-mini